name: Windows package candidate
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID containing the application staging artifact
        required: true
      artifact_name:
        description: Name of the application staging artifact
        required: true
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - name: Install locked package verification dependencies
        run: npm ci --no-audit --no-fund
      - name: Test synthetic lifecycle and bootstrap
        shell: pwsh
        run: |
          ./scripts/Test-InstallerFixture.ps1
          ./scripts/Test-InstallerPrerequisites.ps1
      - name: Download supplied application staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/application-package
      - name: Verify actual packaged startup, both MCPs and preserved restart state
        shell: pwsh
        run: node scripts/test-built-application.mjs (Join-Path $env:RUNNER_TEMP 'application-package')
      - name: Build executable candidate from supplied package
        shell: pwsh
        run: ./scripts/Build-WindowsInstaller.ps1 -PackageDirectory (Join-Path $env:RUNNER_TEMP 'application-package') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'installer')
      - name: Verify the embedded executable payload without installing
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'installer') -Filter '*.exe' | Select-Object -First 1
          ./scripts/Test-WindowsInstallerPayload.ps1 -InstallerPath $setup.FullName
      - name: Upload candidate (not a host-accepted release)
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-candidate
          path: ${{ runner.temp }}/installer/*.exe
          if-no-files-found: error
