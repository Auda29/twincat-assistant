name: Portable checks

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - name: Install locked panel and operator dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit root dependency graph
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Node, built panel and browser SDK contract checks
        run: npm run check
      - name: Restore locked portable engineering projects
        run: dotnet restore engineering/EngineeringSafety.sln --locked-mode
      - name: Build portable engineering components
        run: dotnet build engineering/EngineeringSafety.sln --no-restore --nologo -m:1 /p:UseSharedCompilation=false
      - name: Execute production-domain and real-pipe regression runner
        run: dotnet run --project engineering/tests/Engineering.Safety.Tests/Engineering.Safety.Tests.csproj --no-build --no-restore
